name: Publicar no Apps Script
# Publica o backend automaticamente quando o código muda na main. Antes: testes. Depois: checagem do sistema no ar,
# com volta automática à versão anterior se a checagem falhar.
# Configuração única (ver docs/publicacao.md): segredo CLASPRC_JSON e variáveis SCRIPT_ID, DEPLOYMENT_ID e WEBAPP_URL.
on:
  push:
    branches: [main]
    paths: ['apps-script/**', 'scripts/prepare-gas.js', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency:
  group: publicar-apps-script
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ vars.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
      WEBAPP_URL: ${{ vars.WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verificar configuração
        id: cfg
        run: |
          faltam=""
          [ -z "$CLASPRC_JSON" ] && faltam="$faltam [SEGREDO] CLASPRC_JSON"
          [ -z "$SCRIPT_ID" ] && faltam="$faltam [VARIAVEL] SCRIPT_ID"
          [ -z "$DEPLOYMENT_ID" ] && faltam="$faltam [VARIAVEL] DEPLOYMENT_ID"
          [ -z "$WEBAPP_URL" ] && faltam="$faltam [VARIAVEL] WEBAPP_URL"
          if [ -n "$faltam" ]; then
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Nada foi publicado. Faltam (nome exato, em Settings > Secrets and variables > Actions):$faltam"
              exit 1
            fi
            echo "::notice::Publicação automática ainda não configurada. Faltam:$faltam. Os testes passaram; nada foi publicado."
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar e verificar
        if: steps.cfg.outputs.pronto == 'sim'
        run: |
          set -euo pipefail
          umask 077
          VERSAO_CODIGO="${GITHUB_SHA::7}"
          node scripts/prepare-gas.js
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"build/gas"}' "$SCRIPT_ID" > .clasp.json
          ANTES=$(npx clasp deployments | grep "$DEPLOYMENT_ID" | sed -nE 's/.*@([0-9]+).*/\1/p' | head -1 || true)
          echo "Versão publicada hoje: ${ANTES:-desconhecida}"
          npx clasp push --force
          NOVA=$(npx clasp version "commit $VERSAO_CODIGO" | grep -oE '[0-9]+' | tail -1)
          npx clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "$NOVA" --description "commit $VERSAO_CODIGO"
          OK=nao
          for i in 1 2 3 4 5 6 7 8; do
            R=$(curl -sL -m 120 "$WEBAPP_URL?action=versao" || true)
            if echo "$R" | grep -q "\"versao\":\"$VERSAO_CODIGO\""; then OK=sim; break; fi
            sleep 10
          done
          if [ "$OK" != "sim" ]; then
            echo "::error::A checagem do sistema publicado falhou. Voltando à versão anterior."
            if [ -n "${ANTES:-}" ]; then npx clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "$ANTES" --description "volta automática"; fi
            exit 1
          fi
          echo "Publicado: versão $NOVA do Apps Script, commit $VERSAO_CODIGO."
      - name: Apagar credenciais do executor
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
